name: Kontrola

on:
  push:
  pull_request:
  workflow_dispatch:

# Každý krok, který může selhat, vypíše konec svého výstupu jako anotaci.
# Bez toho je z venku vidět jen návratový kód a chyba se nedá dohledat.

jobs:
  hassfest:
    name: Manifest integrace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalace Home Assistantu
        run: |
          python -m pip install --upgrade pip
          if ! pip install homeassistant ruff > /tmp/log 2>&1; then
            echo "::error::Instalace selhala: $(tail -c 900 /tmp/log | tr '\n' ' ')"
            cat /tmp/log
            exit 1
          fi
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Kontrola syntaxe
        run: python -m compileall -q custom_components/smarthome4u

      - name: Kontrola importů proti Home Assistantu
        run: |
          if ! python -c "
          import sys
          sys.path.insert(0, '.')
          from custom_components.smarthome4u import api, config_flow, home
          from custom_components.smarthome4u import capability, flows, templates
          from custom_components.smarthome4u import config_files
          import custom_components.smarthome4u as integration
          print('Všechny moduly se načetly')
          " > /tmp/log 2>&1; then
            echo "::error::Import selhal: $(tail -c 900 /tmp/log | tr '\n' ' ')"
            cat /tmp/log
            exit 1
          fi
          cat /tmp/log

      - name: Cizí balíčky musí být v manifestu
        run: |
          if ! python scripts/check_imports.py > /tmp/log 2>&1; then
            echo "::error::Nedeklarovaný balíček: $(tail -c 900 /tmp/log | tr '\n' ' ')"
            cat /tmp/log
            exit 1
          fi
          cat /tmp/log

      - name: Ruff
        run: ruff check --select E9,F,B --output-format=github custom_components/smarthome4u

  tests:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalace testovacího prostředí
        run: |
          python -m pip install --upgrade pip
          if ! pip install pytest-homeassistant-custom-component pytest-github-actions-annotate-failures > /tmp/log 2>&1; then
            echo "::error::Instalace testů selhala: $(tail -c 900 /tmp/log | tr '\n' ' ')"
            cat /tmp/log
            exit 1
          fi
          python -c "import homeassistant.const as c; print('Testuje se proti Home Assistantu', c.__version__)"

      - name: Integrace se opravdu přidá a spustí
        run: |
          if ! pytest tests -q --tb=short > /tmp/log 2>&1; then
            echo "::error::Testy selhaly: $(tail -c 900 /tmp/log | tr '\n' ' ')"
            cat /tmp/log
            exit 1
          fi
          cat /tmp/log

  versions:
    name: Shoda verzí
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Manifest, const a UI musí mít stejnou verzi
        run: |
          python -c "
          import json, re
          q = chr(34)
          manifest = json.load(open('custom_components/smarthome4u/manifest.json'))
          const = open('custom_components/smarthome4u/const.py', encoding='utf-8').read()
          js = open('custom_components/smarthome4u/frontend/version.js', encoding='utf-8').read()
          const_v = re.search('VERSION = ' + q + '([^' + q + ']+)' + q, const).group(1)
          ui_v = re.search('APP_VERSION = ' + q + '([^' + q + ']+)' + q, js).group(1)
          assert manifest['version'] == const_v == ui_v, 'verze se neshodují: ' + manifest['version'] + ' / ' + const_v + ' / ' + ui_v
          print('Verze v pořádku:', const_v)
          "
