<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Smarthome4u</title>
    <link rel="stylesheet" href="static/tokens.css" />
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="nav" id="nav" aria-label="Hlavní navigace"></nav>

      <div class="main">
        <header class="header">
          <div class="header__left">
            <span class="header__brand">Smarthome<span>4u</span></span>
            <h1 class="header__title" id="view-title">Domů</h1>
          </div>

          <div class="header__right">
            <div class="status" id="status">
              <span class="status__dot" aria-hidden="true"></span>
              <span id="status-text" role="status">Připojuji se</span>
            </div>
            <button class="button button--ghost" type="button" id="settings-button">
              Nastavení
            </button>
          </div>
        </header>

        <p class="notice" id="notice" hidden></p>

        <main class="view" id="view"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="static/app.js"></script>
  </body>
</html>
